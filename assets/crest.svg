<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" role="img" aria-label="Corsica GAA placeholder crest">
  <!-- PLACEHOLDER CREST — replace this file (or assets/crest.png) with the real crest when ready.
       Shield in the Corsican black and white, with crossed hurleys and a sliotar. -->
  <defs>
    <clipPath id="shield">
      <path d="M100 8 L186 34 V120 C186 178 146 214 100 232 C54 214 14 178 14 120 V34 Z"/>
    </clipPath>
  </defs>
  <!-- outer rim -->
  <path d="M100 4 L190 31 V120 C190 181 148 219 100 236 C52 219 10 181 10 120 V31 Z" fill="#0f6a8c"/>
  <!-- field -->
  <g clip-path="url(#shield)">
    <rect x="0" y="0" width="200" height="240" fill="#ffffff"/>
    <!-- black chief (Corsican colours) -->
    <rect x="0" y="0" width="200" height="74" fill="#111111"/>
    <!-- sea stripe at the base -->
    <rect x="0" y="196" width="200" height="60" fill="#0f6a8c" opacity=".92"/>
    <!-- crossed hurleys -->
    <g stroke="#111111" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M58 194 L128 104 Q140 90 156 100"/>
      <path d="M142 194 L72 104 Q60 90 44 100"/>
    </g>
    <g fill="#111111">
      <path d="M150 94 q16 -4 18 12 q-2 14 -20 10 q-10 -6 2 -22z"/>
      <path d="M50 94 q-16 -4 -18 12 q2 14 20 10 q10 -6 -2 -22z"/>
    </g>
    <!-- sliotar -->
    <circle cx="100" cy="132" r="17" fill="#ffffff" stroke="#111111" stroke-width="5"/>
    <path d="M89 122 q11 10 22 0 M89 142 q11 -10 22 0" stroke="#e8a33c" stroke-width="3" fill="none"/>
  </g>
  <!-- wordmark -->
  <text x="100" y="48" text-anchor="middle" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="800" font-size="26" letter-spacing="3" fill="#ffffff">CORSICA</text>
  <text x="100" y="222" text-anchor="middle" font-family="Poppins, Arial, Helvetica, sans-serif" font-weight="800" font-size="22" letter-spacing="4" fill="#ffffff">GAA</text>
</svg>
